<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">Web Monitor</span>
    <span class="hint">checks run while Chrome runs</span>
  </header>

  <form id="add">
    <div class="row">
      <input id="url" type="url" placeholder="https://page-to-watch.com" required>
    </div>
    <div class="row">
      <input id="keyword" placeholder='optional: watch a phrase, e.g. "sold out"'>
    </div>
    <div class="row">
      <input id="selector" placeholder="optional: CSS selector, e.g. #price">
      <select id="interval" title="how often to check">
        <option value="0.5" selected>30s</option>
        <option value="1">1m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="60">1h</option>
      </select>
      <button class="primary">Watch</button>
    </div>
  </form>

  <ul id="list"></ul>

  <details id="settingsBox">
    <summary>Settings</summary>
    <div class="row">
      <input id="webhook" type="url" placeholder="webhook URL (ntfy.sh / discord / ifttt)">
      <button id="saveWebhook">Save</button>
      <button id="testWebhook">Test</button>
    </div>
    <div id="webhookStatus" class="status"></div>
    <p class="note">Selectors support <code>#id</code>, <code>.class</code>, <code>tag</code> and combinations like <code>div.price</code> — no descendant combinators.</p>
  </details>

  <details id="historyBox">
    <summary>Alert history <button id="clearHistory" class="danger" title="clear history">clear</button></summary>
    <ul id="history"></ul>
  </details>

  <footer>Highlighted row = page changed. Click the link to open it and clear the alert.</footer>

  <script src="popup.js"></script>
</body>
</html>
